<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#238636"/>
      <stop offset="100%" style="stop-color:#58a6ff"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- Decorative elements -->
  <rect x="80" y="520" width="1120" height="3" fill="url(#accent)" rx="2" opacity="0.5"/>
  <circle cx="1150" cy="120" r="80" fill="#58a6ff" opacity="0.05"/>
  <circle cx="100" cy="500" r="120" fill="#238636" opacity="0.05"/>

  <!-- Code brackets background -->
  <text x="1180" y="300" font-family="Courier New,monospace" font-size="200" fill="#30363d" opacity="0.3">&lt;/&gt;</text>

  <!-- Logo / name -->
  <text x="80" y="260" font-family="Arial,Helvetica,sans-serif" font-size="96" font-weight="bold" fill="url(#accent)">
    repo2video
  </text>

  <!-- Tagline -->
  <text x="80" y="340" font-family="Arial,Helvetica,sans-serif" font-size="36" fill="#8b949e">
    Paste any GitHub URL → Get a 1080p narrated code walkthrough video
  </text>

  <!-- Sub-tagline -->
  <text x="80" y="400" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#484f58">
    Open source. Free. Runs on your machine.
  </text>

  <!-- GitHub link -->
  <text x="80" y="480" font-family="Courier New,monospace" font-size="20" fill="#58a6ff">
    github.com/mohitmishra786/repo2video
  </text>
</svg>
