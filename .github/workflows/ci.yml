name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Gate 1: syntax/compile check on every tracked Python file.
  # Fast, dependency-free; catches unterminated strings etc. before installs run.
  compile-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile-check all tracked Python files
        run: |
          set -e
          files=$(git ls-files '*.py')
          if [ -z "$files" ]; then
            echo "No Python files found"
            exit 1
          fi
          echo "$files" | xargs python -m py_compile
          echo "py_compile OK for all tracked .py files"

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -r requirements.txt

      - name: Test with pytest
        run: pytest tests/ -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Lint with ruff
        run: ruff check .

  import-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Smoke test imports
        run: |
          python -c "from repo_fetcher import RepoFetcher; print('repo_fetcher OK')"
          python -c "from advanced_animation.core.data_structures import Storyboard; print('data_structures OK')"

  # Gate 4: dependency vulnerability scan.
  # Warn-only (continue-on-error) until the baseline audit lands; flip to
  # blocking once known-good pins are established.
  pip-audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Audit dependencies (warn-only)
        run: |
          pip-audit -r requirements.txt --desc || true
